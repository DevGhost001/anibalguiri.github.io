<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Brevemente | Cybersecurity & Dev Portfolio</title>
  <link rel="icon" type="image/png" href="/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background-color: #0b0f19; /* matches cyberpunk dark mode */
      color: #fff;
      font-family: 'Inter', sans-serif;
      text-align: center;
    }
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
      padding: 2rem;
    }
    .title {
      font-family: 'Orbitron', sans-serif;
      font-size: 3.5rem;
      color: #00ffcc;
      text-shadow: 0 0 15px rgba(0, 255, 204, 0.4);
      margin: 0;
      letter-spacing: 2px;
    }
    .sub {
      font-family: 'JetBrains Mono', monospace;
      color: #8892b0;
      font-size: 1.2rem;
      margin: 0;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.75rem 1.75rem;
      background: transparent;
      color: #00ffcc;
      border: 1px solid #00ffcc;
      border-radius: 4px;
      text-decoration: none;
      font-family: 'JetBrains Mono', monospace;
      font-size: 1rem;
      transition: all 0.3s ease;
      margin-top: 1.5rem;
      cursor: pointer;
    }
    .btn:hover {
      background: rgba(0, 255, 204, 0.1);
      box-shadow: 0 0 15px rgba(0, 255, 204, 0.3);
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1 class="title">Brevemente</h1>
    <p class="sub">&gt;_ O código fonte ou os detalhes deste projeto estarão disponíveis em breve.</p>
    <a href="index.html" class="btn">
      <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
      Voltar à Home
    </a>
  </div>
</body>
</html>
